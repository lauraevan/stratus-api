name: Add mail provider fallback

on:
  push:
    paths:
      - ".github/workflows/add-mail-fallback.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add sequential mail provider fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("api/api.js")
          source = path.read_text(encoding="utf-8")

          start_marker = "async function getVerificationCode("
          end_marker = "function gameHeaders(token) {"

          if start_marker not in source or end_marker not in source:
              raise SystemExit("Could not locate the existing mail account code.")

          start = source.index(start_marker)
          end = source.index(end_marker)

          replacement = r'''const MAIL_PROVIDERS = [
            { name: "Mail.tm", baseUrl: "https://api.mail.tm" },
            { name: "Mail.gw", baseUrl: "https://api.mail.gw" },
            ...String(process.env.MAIL_PROVIDER_URLS || "")
              .split(",")
              .map((baseUrl) => baseUrl.trim().replace(/\/+$/, ""))
              .filter(Boolean)
              .map((baseUrl, index) => ({
                name: `Custom Mail ${index + 1}`,
                baseUrl,
              })),
          ];

          function mailBody(value) {
            if (Array.isArray(value)) return value.join(" ");
            return typeof value === "string" ? value : "";
          }

          async function fetchMailJson(provider, path, options, action) {
            const response = await fetch(`${provider.baseUrl}${path}`, options);
            const raw = await response.text();

            let data = {};
            if (raw) {
              try {
                data = JSON.parse(raw);
              } catch {
                throw new Error(`${provider.name}: invalid JSON during ${action}`);
              }
            }

            if (!response.ok) {
              throw new Error(
                `${provider.name}: ${action} failed with HTTP ${response.status}`,
              );
            }

            return data;
          }

          async function getVerificationCode(
            provider,
            mailJwt,
            maxRetries = 24,
          ) {
            const headers = {
              Authorization: `Bearer ${mailJwt}`,
              "Content-Type": "application/json",
            };

            for (let attempt = 0; attempt < maxRetries; attempt++) {
              await new Promise((resolve) => setTimeout(resolve, 2500));

              try {
                const data = await fetchMailJson(
                  provider,
                  "/messages?page=1",
                  { headers },
                  "inbox polling",
                );

                const messages = data["hydra:member"] || [];

                for (const message of messages.slice(0, 5)) {
                  const full = await fetchMailJson(
                    provider,
                    `/messages/${message.id}`,
                    { headers },
                    "message reading",
                  );

                  const body = `${mailBody(full.text)} ${mailBody(full.html)}`
                    .replace(/<[^>]*>/g, " ")
                    .replace(/\s+/g, " ");

                  const match = body.match(/\b\d{6}\b/);
                  if (match) return match[0];
                }
              } catch (error) {
                if (attempt === maxRetries - 1) throw error;
              }
            }

            throw new Error(
              `${provider.name}: verification email timed out`,
            );
          }

          async function createAccountWithProvider(provider) {
            const domainData = await fetchMailJson(
              provider,
              "/domains",
              undefined,
              "domain lookup",
            );

            const domains = domainData["hydra:member"] || [];
            if (!domains.length) {
              throw new Error(`${provider.name}: no mail domains available`);
            }

            const domain =
              domains[Math.floor(Math.random() * domains.length)].domain;

            const mailUser =
              `rcn_${Math.random().toString(36).substring(2, 11)}`;
            const email = `${mailUser}@${domain}`;
            const mailPassword = generatePassword();
            const raccoonPassword = generatePassword();
            const sn = generateSN();

            await fetchMailJson(
              provider,
              "/accounts",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  address: email,
                  password: mailPassword,
                }),
              },
              "mailbox creation",
            );

            const tokenData = await fetchMailJson(
              provider,
              "/token",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  address: email,
                  password: mailPassword,
                }),
              },
              "mailbox authentication",
            );

            const mailJwt = tokenData.token;
            if (!mailJwt) {
              throw new Error(`${provider.name}: mailbox token was missing`);
            }

            const headers = {
              "Content-Type": "application/x-www-form-urlencoded",
              "User-Agent":
                "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/147.0.0.0 Safari/537.36",
            };

            const base = {
              sn,
              model: "Chrome/147.0.0.0",
              version_code: "1",
              version_name: "1.0.0",
              device_name: "我的设备",
              os: "web",
            };

            const sendEmailResponse = await fetch(
              "https://www.raccoongame.com/users/sendEmail",
              {
                method: "POST",
                headers,
                body: new URLSearchParams({
                  email,
                  type: "register",
                  ...base,
                }),
              },
            );

            if (!sendEmailResponse.ok) {
              throw new Error(
                `Raccoon verification request failed with HTTP ${sendEmailResponse.status}`,
              );
            }

            const code = await getVerificationCode(provider, mailJwt);

            const registrationResponse = await fetch(
              "https://www.raccoongame.com/users/emailRegister",
              {
                method: "POST",
                headers,
                body: new URLSearchParams({
                  email,
                  code,
                  password: raccoonPassword,
                  phone: "1",
                  country: "Brazil",
                  ...base,
                }),
              },
            );

            if (!registrationResponse.ok) {
              throw new Error(
                `Raccoon registration failed with HTTP ${registrationResponse.status}`,
              );
            }

            const loginResponse = await fetch(
              "https://www.raccoongame.com/users/emailLogin",
              {
                method: "POST",
                headers,
                body: new URLSearchParams({
                  email,
                  password: raccoonPassword,
                  ...base,
                }),
              },
            );

            if (!loginResponse.ok) {
              throw new Error(
                `Raccoon login failed with HTTP ${loginResponse.status}`,
              );
            }

            const loginData = await loginResponse.json();
            if (loginData.status !== 200) {
              throw new Error("Raccoon login was rejected");
            }

            let userToken = loginData.data?.user_token || "";
            const cookie = loginResponse.headers.get("set-cookie");

            if (cookie) {
              const match = cookie.match(/as_user_token=([^;]+)/);
              if (match) userToken = match[1];
            }

            if (!userToken) {
              throw new Error("Raccoon login returned no user token");
            }

            return { sn, token: userToken };
          }

          async function createAccount() {
            const errors = [];

            for (const provider of MAIL_PROVIDERS) {
              try {
                console.log(`[mail] trying ${provider.name}`);
                const account = await createAccountWithProvider(provider);
                console.log(`[mail] ${provider.name} succeeded`);
                return account;
              } catch (error) {
                const message =
                  error instanceof Error ? error.message : String(error);
                errors.push(`${provider.name}: ${message}`);
                console.warn(
                  `[mail] ${provider.name} failed; trying fallback`,
                );
              }
            }

            throw new Error(
              `All temporary-mail providers failed: ${errors.join(" | ")}`,
            );
          }

          '''

          updated = source[:start] + replacement + source[end:]

          old_timeout = '''  req.setTimeout(30_000, () => {
            res.status(408).json({ error: "Request timeout." });
          });'''

          new_timeout = '''  if (req.path === "/cloud/v1/createSession") {
            req.setTimeout(180_000);
            res.setTimeout(180_000);
          } else {
            req.setTimeout(30_000);
            res.setTimeout(30_000);
          }'''

          if old_timeout not in updated:
              raise SystemExit("Could not locate the existing request timeout.")

          updated = updated.replace(old_timeout, new_timeout, 1)
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Validate JavaScript
        run: node --check api/api.js

      - name: Commit patched backend
        shell: bash
        run: |
          if git diff --quiet -- api/api.js; then
            echo "api/api.js is already patched."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/api.js
          git commit -m "Add fallback mail providers"
          git push
